name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<Cargo.toml version>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Windows x64 Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $cargoToml = Get-Content -Raw Cargo.toml
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $cargoVersion = $Matches[1]
          } else {
            throw "Could not parse package version from Cargo.toml"
          }

          if ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = "v$cargoVersion"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$cargoVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=Tiny_Sink-$tag-windows-x64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run unit tests
        shell: pwsh
        run: cargo test --no-fail-fast --locked --target x86_64-pc-windows-msvc

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package release artifacts
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
        run: |
          $exePath = "target\x86_64-pc-windows-msvc\release\Tiny_Sink.exe"
          if (-not (Test-Path $exePath)) {
            throw "Release binary not found at $exePath"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exePath "dist\Tiny_Sink.exe"

          $staging = Join-Path $env:TEMP "tiny_sink_zip"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $staging
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "dist\Tiny_Sink.exe" $staging
          Copy-Item "LICENSE" $staging
          Copy-Item "README.md" $staging

          $zipPath = Join-Path "dist" $env:ZIP_NAME
          Compress-Archive -Path "$staging\*" -DestinationPath $zipPath -Force

          $hashes = @("Tiny_Sink.exe", $env:ZIP_NAME) | ForEach-Object {
            $item = Join-Path "dist" $_
            $sha = (Get-FileHash -Path $item -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha  $_"
          }
          $hashes | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Tiny_Sink ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/Tiny_Sink.exe
            dist/${{ steps.meta.outputs.zip_name }}
            dist/SHA256SUMS.txt

